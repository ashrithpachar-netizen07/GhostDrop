services:
  - type: web
    name: ghostdrop
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: JWT_SECRET, generateValue: true}
      - {key: TURSO_DATABASE_URL, sync: false}
      - {key: TURSO_AUTH_TOKEN, sync: false}
      - {key: BREVO_API_KEY, sync: false}
      - {key: MAIL_FROM, sync: false}
